<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sistema Interno de Reportes Fénix - Uso Privado</title>
  <link rel="stylesheet" href="css/acceso.css">
</head>
<body>
  <div class="login-box">
    <img src="img/Fenix Brands Logo-02.png" alt="Fénix" class="logo">

    <h2>Portal de Reportes</h2>
    <p class="subtitle">Transformación Digital</p>

    <input
    type="email"
    id="usuario"
    placeholder="Correo corporativo"
    autocomplete="username"
    required>

<input
    type="password"
    id="password"
    placeholder="Contraseña"
    autocomplete="current-password"
    required>

<button onclick="login()">Entrar</button>

<p id="error"></p>

  </div>

  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/login.js"></script>
   <footer>
    <div>
        &copy; 2026 Transformación Digital | Portal de Reportes | V2.01
    </div>

    <a
        href="https://wa.me/595983044405?text=Escribo%20por%20una%20consulta%20de%20la%20plataforma"
        target="_blank"
        rel="noopener noreferrer"
        class="footer-contact">

        <img
            src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"
            alt="WhatsApp">

        <span>Contactar</span>
    </a>
</footer>

</body>
</html>
